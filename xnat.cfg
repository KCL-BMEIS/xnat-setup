##XNAT
site_name=KCL
xnat_host=http://
xnat_admin_user=xnatadmin
xnat_admin_email=xnat@kcl.ac.uk
xnat_smtp_server=localhost
psql_pwd=
xnat_home=/xnat-data/xnat
postgres_path=/xnat-data/postgresql
import_data_folder=/xnat-data/import_data
##NGINX
ssl=false
ssl_crt_file=xnat.crt
ssl_key_file=xnat.key
ssl_trust_file=xnat.pem
ssl_dhparam_file=dhparam.pem
##RESOURCESETTINGS:DEFAULT8GBRAM,6CPUCORES
##Memory,ram
memory=8GB
cpu_cores=6
##TOMCAT
Xms=512m
Xmx=3072m
##POSTGRESQL
max_connections=100
shared_buffers=1GB
effective_cache_size=3GB
maintenance_work_mem=256MB
checkpoint_completion_target=0.9
wal_buffers=16MB
default_statistics_target=100
random_page_cost=1.1
effective_io_concurrency=200
work_mem=5242kB
min_wal_size=1GB
max_wal_size=4GB
max_worker_processes=3
max_parallel_workers_per_gather=2
max_parallel_workers=3
max_parallel_maintenance_workers=2
#XNATVersion
xnat_version=1.8.9.1
#xnat_plugins
ohif_viewer=true
container_service=true
batch_launch=true
xsync=true
ldap=true
dqr=true
jupyter=true
#plugin_versions
ohif_viewer_version=3.5.3-XNAT-1.8.7
container_service_version=3.4.1
batch_launch_version=0.6.0
xsync_version=1.6.0
ldap_version=1.1.0
dqr_version=1.1.0
jupyter_version=1.0.0


