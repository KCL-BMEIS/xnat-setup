stages:
  - build
  - test
  - cleanup 

build_xnat_ubuntu:
  #image: ubuntu:20.04
  stage: build
  only:
    - main
  before_script:
    - export src_dir="${CI_PROJECT_DIR}"
    - export git_hash="${CI_COMMIT_SHA:0:6}"
    - hostname
    - whoami
    - pwd
    - echo "Sources - ${src_dir}"
    - echo "Commit - ${git_hash}"
    - echo "Project build - ${pb_dir}"
  script:
    # Use test xnat.cfg
    - apt update && apt install bats
    - cd ${src_dir}
    - rm xnat.cfg
    - cp ./tests/ci/xnat-ci.cfg xnat.cfg
    - cd Linux
    - ./build.sh
  tags:
    - ubuntu-rosalind



test_xnat_ubuntu:
  stage: test
  before_script:
    - export src_dir="${CI_PROJECT_DIR}"
    - export git_hash="${CI_COMMIT_SHA:0:6}"
    - hostname
    - whoami
    - pwd
    - echo "Sources - ${src_dir}"
    - echo "Commit - ${git_hash}"
    - echo "Project build - ${pb_dir}"
  script:
    - cd ${src_dir}/tests/ci/
    - bats run_linux_tests_ci.sh
  only: 
    - main
  tags:
    - ubuntu-rosalind

cleanup_xnat_ubuntu:
  stage: cleanup
  before_script:
    - export src_dir="${CI_PROJECT_DIR}"
    - export git_hash="${CI_COMMIT_SHA:0:6}"
    - hostname
    - whoami
    - pwd
    - echo "Sources - ${src_dir}"
    - echo "Commit - ${git_hash}"
    - echo "Project build - ${pb_dir}"
  script:
    - cd ${src_dir}/Linux
    - ./clean_docker.sh
    - rm -rf /xnat-data
  only: 
    - main
  tags:
    - ubuntu-rosalind

