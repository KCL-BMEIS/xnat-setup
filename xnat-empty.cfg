##XNAT
site_name=KCL
xnat_host=http://
xnat_admin_user=xnatadmin
xnat_admin_email=xnat@kcl.ac.uk
xnat_smtp_server=localhost
psql_pwd=
xnat_data=/xnat-data
##NGINX
ssl=false
ssl_crt_file=xnat.crt
ssl_key_file=xnat.key
ssl_trust_file=xnat.pem
ssl_dhparam_file=dhparam.pem
##RESOURCESETTINGS:DEFAULT8GBRAM,6CPUCORES
##TOMCAT
Xms=1024m
Xmx=6144m
# Garbage collector and postgresql save/restore parralele cpus
cpu_cores=6
##POSTGRESQL
# legacy: for upgrading old systems, use ALPINE postgresql image.
use_pg_alpine=false
# Performce Postgresql Settings
max_connections=100
shared_buffers=2GB
effective_cache_size=7680MB
maintenance_work_mem=640MB
checkpoint_completion_target=0.9
wal_buffers=16MB
default_statistics_target=100
random_page_cost=1.1
effective_io_concurrency=200
work_mem=13107kB
huge_pages=try
jit=off
wal_compression=lz4
min_wal_size=1GB
max_wal_size=4GB
max_worker_processes=4
max_parallel_workers_per_gather=2
max_parallel_workers=4
max_parallel_maintenance_workers=2
#XNATVersion
xnat_version=1.10.2
#xnat_plugins
ohif_viewer=true
container_service=true
batch_launch=true
xsync=true
ldap=true
dqr=true
jupyter=true
#plugin_versions
ohif_viewer_version=3.8.0
container_service_version=3.9.0
batch_launch_version=0.9.0
xsync_version=1.8.1
ldap_version=1.3.0
dqr_version=3.1.0
jupyter_version=1.3.4
#advanced-ifempty,doesnotuse
docker_subnet=
# container service - set to true if using SSL certificates
docker_tls=false


