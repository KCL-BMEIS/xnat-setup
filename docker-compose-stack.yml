version: '3.8'

services:
    xnat-web:
       image: xnat:latest
       deploy:
          replicas: 1
          restart_policy:
            condition: any
          placement:
            constraints: [node.role == manager]
       ports:
         #- "8080:8080"
         - "8104:8104"
       depends_on:
         - xnat-db
       environment:
         - XNAT_HOME=/data/xnat/home
       secrets:
         - pgpass
       #networks:
         #- xnat-net
       volumes:
         - ${xnat_data}/xnat/archive:/data/xnat/archive
         - ${xnat_data}/xnat/build:/data/xnat/build
         - ${xnat_data}/xnat/tomcat_logs:/data/xnat/home/logs
         - ${xnat_data}/xnat/scripts:/data/scripts
         - ${xnat_data}/xnat/inbox:/data/xnat/inbox
         - ${xnat_data}/xnat/ldap:/data/xnat/home/config/auth/
         #LINX- /var/run/docker.sock:/var/run/docker.sock
         - ${xnat_data}/import_data:/data/import_data
         #WINX- ./volume/postgres-data:/pg_backup
    xnat-db:
       image: postgres-xnat:latest
       deploy:
          replicas: 1
          restart_policy:
            condition: any
          placement:
            constraints: [node.role == manager]
          resources:
            reservations:
              cpus: '3'
              memory: 4000M
       environment:
         POSTGRES_USER: ${psql_user}
         POSTGRES_PASSWORD_FILE: /run/secrets/pgpass
         POSTGRES_DB: xnat
        # only uncomment on modern Linux hosts with nvme and if have permission to do so.
         # uncomment
#       security_opt:
#         - seccomp:unconfined
       command: ["postgres", "-c", "shared_buffers=${shared_buffers}"]
       secrets:
         - pgpass
       #networks:
         #- xnat-net
       volumes:
         # set shared memory limit when using docker compose - default 64mb, too small. Set to 1GB
         - shm:/dev/shm # mount the tmpfs-backed volume here
         #LINX- ${xnat_data}/postgresql/postgres-data:/var/lib/postgresql/data
    xnat-nginx:
       image: nginx-xnat:latest
       deploy:
          replicas: 1
          restart_policy:
            condition: any
          placement:
            constraints: [ node.role == manager ]
       volumes:
        - ${xnat_data}/xnat/certificates:/etc/ssl
        - ${xnat_data}/xnat/nginx_logs:/var/log/nginx
        #LINX- /var/run/docker.sock:/var/run/docker.sock:ro
       ports:
        - "80:80"
        - "443:443"
#        - target: 80
#          published: 80
#          protocol: tcp
#          mode: host
#        - target: 443
#          published: 443
#          protocol: tcp
#          mode: host
       depends_on:
        - xnat-web
       #networks:
         #- xnat-net

secrets:
  pgpass:
     external: true


volumes:
  shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1g,mode=1777"


# If a specific subnet is required:
#networks:
  #xnat-net:
    #name: xnat-stack-net
    #external: true